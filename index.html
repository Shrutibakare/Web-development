<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

/* Background */
body {
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
    animation: fadeIn 1.5s ease-in-out;
}

/* Header */
header {
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    animation: slideDown 1s ease;
}

/* Section */
section {
    padding: 20px;
    animation: fadeIn 2s ease;
}

/* Container */
.container {
    margin: 40px auto;
    max-width: 1100px;
    background: #1e293b;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;

    animation: fadeInUp 1.5s ease;
}

/* Cards */
.card {
    background: #334155;
    color: #e2e8f0;
    padding: 20px;
    border-radius: 12px;
    text-decoration: none;
    transition: all 0.3s ease;
}

/* Hover Animation */
.card:hover {
    transform: translateY(-10px) scale(1.03);
    background: #475569;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

/* Footer */
footer {
    margin-top: 20px;
    padding: 10px;
    color: #94a3b8;
    animation: fadeIn 2s ease;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideDown {
    from { transform: translateY(-40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeInUp {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

</style>
</head>

<body>

</header>
