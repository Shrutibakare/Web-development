<!DOCTYPE html>
<html>
<head>
    <title>XML Data</title>

    <style>
        .student {
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightblue;
            width: 200px;
        }
    </style>

</head>
<body>

<h2>Student Data</h2>

<div id="output"></div>

<script>
fetch("student.xml")
.then(res => res.text())
.then(data => {
    let parser = new DOMParser();
    let xml = parser.parseFromString(data, "text/xml");

    let students = xml.getElementsByTagName("student");
    let output = document.getElementById("output");

    for(let i=0; i<students.length; i++){
        output.innerHTML += `
            <div class="student">
                <p>Name: ${students[i].getElementsByTagName("name")[0].textContent}</p>
                <p>Age: ${students[i].getElementsByTagName("age")[0].textContent}</p>
                <p>City: ${students[i].getElementsByTagName("city")[0].textContent}</p>
            </div>
        `;
    }
});
</script>

</body>
</html>
